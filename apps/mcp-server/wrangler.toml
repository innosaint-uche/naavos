name = "naavos-mcp"
main = "src/index.js"
compatibility_date = "2026-08-25"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://naavos.radoss.agency,https://mcp.naavos.radoss.agency"
MCP_RESOURCE_URL = "https://mcp.naavos.radoss.agency/mcp"
# Configure OAUTH_ISSUER, OAUTH_AUDIENCE and real authorization/token endpoints before deployment.
RELEASE_SHA = "unbound" # deployment must inject the exact reviewed source revision
# Identity-provider tokens are not accepted as NAAvOS resource tokens.

[[d1_databases]]
binding = "DB"
database_name = "naavos-avatar"
database_id = "7b3c23b3-0c74-4eed-a541-519589ae4eef"
migrations_dir = "migrations"
